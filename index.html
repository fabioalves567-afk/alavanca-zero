<style>

.progress-wrap{margin:16px; }

.progress-bar-fill{background:var(--azul); height:100%; border-radius:8px; transition:width .3s;}
.progress-label{font-size:13px; color:var(--texto-suave); margin-top:6px; text-align:center;}
.opt-grid{display:flex; flex-direction:column; gap:10px; margin-top:14px;}

.pin-dot.filled{background:var(--azul);}
.pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
.pin-key{padding:18px 0; border-radius:12px; border:1.5px solid var(--borda); background:#fff; font-size:22px; font-weight:700; cursor:pointer;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.modal-box{background:#fff; width:100%; max-width:720px; border-radius:16px 16px 0 0; max-height:88vh; overflow-y:auto; padding:20px;}
.modal-box h2{margin:0 0 4px; font-size:18px;}
.modal-close{float:right; border:none; background:#eef1f7; border-radius:50%; width:32px; height:32px; font-size:16px; cursor:pointer;}
.modal-section{margin-top:18px;}

.btn-purple{background:#6a3de8; color:#fff;}

.modal-btn-row{display:flex; gap:10px; margin-top:10px;}
.modal-btn-row .btn{width:auto; flex:1; padding:12px; font-size:13px;}
.theme-tag{display:inline-block; background:#eaf0ff; color:var(--azul-escuro); border-radius:14px; padding:4px 12px; font-size:12px; font-weight:700; margin:3px 4px 3px 0;}

.filter-row .tab-btn{margin:0;}

<script>
/* ============ CONFIGURAÇÃO FIREBASE ============
   Substitua pelos dados do SEU projeto Firebase
   (Console Firebase > Configurações do projeto > Seus apps > SDK) */
const firebaseConfig = {
  apiKey: "AIzaSyAJCgFSVEPTyydDAMc5QbBPnSBq2cWohHc",
  authDomain: "fahrwerk-smartflow.firebaseapp.com",
  databaseURL: "https://fahrwerk-smartflow-default-rtdb.firebaseio.com",
  projectId: "fahrwerk-smartflow",
  storageBucket: "fahrwerk-smartflow.firebasestorage.app",
  messagingSenderId: "1084077814941",
  appId: "1:1084077814941:web:ce4647a33b3c3d0edad074",
  measurementId: "G-M02DYNDTNF"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const VERSAO_QUESTIONARIO = "v1";
// Conta técnica usada somente pelo login por PIN.
// Crie esta conta uma única vez no Firebase Authentication.
// O monitor nunca precisa informar este e-mail.
const MONITOR_AUTH_EMAIL = "monitor@alavanca-zero.app";
const PIN_PREFIX = "ALZ-";


/* ÁREA DO MONITOR
   O monitor digita SOMENTE o PIN.
   Internamente, o PIN é usado como senha do Firebase Authentication.
   O PIN não é gravado no Firestore nem fica visível na tela. */

/* ============ PERGUNTAS PADRÃO (seed inicial) ============ */
const DEFAULT_QUESTIONS = [
  {id:"q1", order:1, active:true, required:true, type:"single",
   text:"Como você considera a operação da alavanca de mudanças?",
   options:["Muito fácil","Fácil","Média","Difícil","Muito difícil"]},
  {id:"q2", order:2, active:true, required:true, type:"single",
   text:"Qual etapa da operação da alavanca exige maior atenção?",
   options:["Posicionamento da alavanca","Fixação","Regulagem","Aperto/torque","Conferência final","Todas igualmente"]},
  {id:"q3", order:3, active:true, required:true, type:"single",
   text:"Você considera que o padrão correto da alavanca está claro durante a operação?",
   options:["Sim, totalmente","Sim, mas poderia ser mais claro","Parcialmente","Não"]},
  {id:"q4", order:4, active:true, required:true, type:"multi",
   text:"O que pode dificultar a execução correta dessa operação?",
   options:["Ritmo da linha","Conversas ou movimentação no posto","Mudança de modelo","Dificuldade para visualizar o padrão","Ferramenta/equipamento","Falta de informação","Outro"]},
  {id:"q5", order:5, active:true, required:true, type:"single",
   text:"Em qual momento existe maior possibilidade de ocorrer um erro?",
   options:["No início da operação","Durante o posicionamento","Durante a fixação","Durante a regulagem","Durante o aperto","Na conferência final"]},
  {id:"q6", order:6, active:true, required:true, type:"single",
   text:"Você considera que existe tempo suficiente para realizar a operação corretamente?",
   options:["Sim","Na maioria das vezes","Às vezes","Não"]},
  {id:"q7", order:7, active:true, required:true, type:"single",
   text:"A posição correta da alavanca é fácil de identificar visualmente?",
   options:["Sim","Parcialmente","Não"]},
  {id:"q8", order:8, active:true, required:true, type:"multi",
   text:"O que poderia melhorar a visualização do padrão correto?",
   options:["Foto/imagem no posto","Marcação visual na própria peça","Instrução de trabalho mais clara","Vídeo curto","Treinamento prático","Não vejo necessidade de mudança","Outro"]},
  {id:"q9", order:9, active:true, required:true, type:"multi",
   text:"Durante essa operação, o que mais pode tirar a atenção do processo?",
   options:["Conversas","Movimentação de pessoas","Mudança de modelo","Pressão/ritmo da produção","Problemas no equipamento","Dúvidas sobre o processo","Cansaço","Nada específico","Outro"]},
  {id:"q10", order:10, active:true, required:true, type:"single",
   text:"Quando você tem alguma dúvida sobre a operação, consegue obter ajuda rapidamente?",
   options:["Sempre","Na maioria das vezes","Às vezes","Raramente","Não"]},
  {id:"q11", order:11, active:true, required:true, type:"single",
   text:"Como você avalia o treinamento recebido para essa operação?",
   options:["Muito bom","Bom","Regular","Precisa melhorar","Não recebi treinamento específico"]},
  {id:"q12", order:12, active:true, required:true, type:"multi",
   text:"Qual tipo de prevenção você considera mais útil para evitar um erro na alavanca?",
   options:["Melhor informação visual","Treinamento prático","Checklist de conferência","Dispositivo à prova de erro","Conferência adicional","Outra solução"]},
  {id:"q13", order:13, active:true, required:true, type:"single",
   text:"Você acredita que existe alguma característica do processo que favorece a ocorrência do erro?",
   options:["Sim","Talvez","Não","Não sei avaliar"]},
  {id:"q14", order:14, active:true, required:false, type:"open",
   text:"Qual característica do processo pode favorecer o erro?",
   conditional:{dependsOn:"q13", showIfIn:["Sim","Talvez"]}},
  {id:"q15", order:15, active:true, required:false, type:"open",
   text:'Se você pudesse mudar apenas uma coisa nessa operação para ajudar a chegar ao "Erro Zero", o que mudaria?'}
];

/* ============ ESTADO GLOBAL ============ */
let state = {
  screen: "intro",           // intro | quiz | thanks | monitorLogin | monitor
  questions: [],
  visibleQuestions: [],
  qIndex: 0,
  answers: {},
  submitting: false,
  monitorLoggedIn: false,
  monitorUser: null,
  pinInput: "",
  showPinModal: false,
  showBackupModal: false,
  monitorTab: "dashboard",   // dashboard | analise | voz | matriz | respostas | admin
  filtroPeriodo: "todos",    // todos | hoje | 7dias | 30dias
  responses: [],
  responsesLoaded: false,
  searchTerm: "",
  editingQuestion: null,
  editingResponse: null,
  editingResponseAnswers: {},
  charts: {}
};

const $ = sel => document.querySelector(sel);
const app = () => document.getElementById("app");

function toast(msg, ms){
  const t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms||4000);
}

/* Evita que uma chamada ao Firestore fique "pendurada" pra sempre (ex.: bloqueio de rede corporativa) */
function withTimeout(promise, ms, msg){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error(msg||"Tempo esgotado ao falar com o servidor.")), ms||12000))
  ]);
}

/* ============ CARREGAMENTO DE PERGUNTAS ============ */
async function loadQuestions(){
  try{
    const doc = await withTimeout(db.collection("config").doc("questionario").get(), 12000, "Tempo esgotado ao carregar as perguntas.");
    if(doc.exists && doc.data().perguntas && doc.data().perguntas.length){
      state.questions = doc.data().perguntas.sort((a,b)=>a.order-b.order);
    } else {
      await withTimeout(db.collection("config").doc("questionario").set({perguntas: DEFAULT_QUESTIONS}), 12000);
      state.questions = DEFAULT_QUESTIONS.slice();
    }
  }catch(e){
    console.error("Erro ao carregar perguntas, usando padrão local", e);
    state.questions = DEFAULT_QUESTIONS.slice();
    toast("Sem conexão com o servidor — usando questionário padrão local.");
  }
}

async function saveQuestions(){
  await withTimeout(
    db.collection("config").doc("questionario").set({perguntas: state.questions}),
    12000,
    "Tempo esgotado ao salvar as perguntas — verifique a conexão."
  );
}

/* ============ AUTENTICAÇÃO DO MONITOR ============ */
function pinToPassword(pin){
  return PIN_PREFIX + pin;
}

function validarPin(pin){
  return /^\d{4}$/.test(pin);
}

async function signInMonitorPin(pin){
  if(!validarPin(pin)){
    toast("Digite um PIN de 4 números.");
    return;
  }
  try{
    await withTimeout(
      auth.signInWithEmailAndPassword(MONITOR_AUTH_EMAIL, pinToPassword(pin)),
      15000,
      "Tempo esgotado no login."
    );

    const user = auth.currentUser;
    if(!user) throw new Error("Usuário não autenticado.");

    const profile = await withTimeout(
      db.collection("users").doc(user.uid).get(),
      10000,
      "Tempo esgotado ao validar o acesso."
    );

    if(!profile.exists || profile.data().role !== "monitor"){
      await auth.signOut();
      throw new Error("Usuário não autorizado como monitor.");
    }

    state.monitorLoggedIn = true;
    state.monitorUser = user;
    state.screen = "monitor";
    state.monitorTab = "dashboard";
    state.pinInput = "";
    await loadResponses();
    render();
  }catch(e){
    console.error(e);
    state.pinInput = "";
    render();
    toast("PIN incorreto ou acesso não autorizado.", 4000);
  }
}

async function alterarPinMonitor(pinAtual, pinNovo){
  if(!validarPin(pinAtual) || !validarPin(pinNovo)){
    toast("O PIN deve ter exatamente 4 números.");
    return;
  }
  if(pinAtual === pinNovo){
    toast("O novo PIN deve ser diferente do atual.");
    return;
  }

  const user = auth.currentUser;
  if(!user){
    toast("Sessão do monitor não encontrada.");
    return;
  }

  try{
    const credential = firebase.auth.EmailAuthProvider.credential(
      MONITOR_AUTH_EMAIL,
      pinToPassword(pinAtual)
    );

    await withTimeout(
      user.reauthenticateWithCredential(credential),
      15000,
      "Tempo esgotado ao validar o PIN atual."
    );

    await withTimeout(
      user.updatePassword(pinToPassword(pinNovo)),
      15000,
      "Tempo esgotado ao alterar o PIN."
    );

    state.showPinModal = false;
    state.pinInput = "";
    render();
    toast("PIN alterado com sucesso.");
  }catch(e){
    console.error(e);
    toast("Não foi possível alterar o PIN. Confira o PIN atual.", 5000);
  }
}

async function monitorLogout(){
  try{ await auth.signOut(); }catch(e){ console.error(e); }
  state.monitorLoggedIn=false;
  state.monitorUser=null;
  state.screen="intro";
  state.pinInput="";
  render();
}

/* ============ NAVEGAÇÃO DO QUIZ ============ */

function computeVisibleQuestions(){
  const active = state.questions.filter(q=>q.active).sort((a,b)=>a.order-b.order);
  state.visibleQuestions = active.filter(q=>{
    if(!q.conditional) return true;
    const dep = state.answers[q.conditional.dependsOn];
    const visible = dep && q.conditional.showIfIn.includes(dep);
    if(!visible && state.answers[q.id]!==undefined) delete state.answers[q.id]; // evita enviar resposta "fantasma" de pergunta condicional escondida
    return visible;
  });
}

function startQuiz(){
  state.screen="quiz"; state.qIndex=0; state.answers={};
  computeVisibleQuestions();
  render();
}

function currentQuestion(){ return state.visibleQuestions[state.qIndex]; }

function answerValid(q){
  if(!q.required) return true;
  const v = state.answers[q.id];
  if(q.type==="multi") return Array.isArray(v) && v.length>0;
  return v !== undefined && v !== null && String(v).trim() !== "";
}

function goNext(){
  const q = currentQuestion();
  if(!answerValid(q)){ toast("Essa pergunta precisa de uma resposta."); return; }
  computeVisibleQuestions();
  // recompute index position based on same question id, since visible list may change (conditional)
  const idOrder = state.visibleQuestions.findIndex(x=>x.id===q.id);
  if(idOrder < state.visibleQuestions.length-1){
    state.qIndex = idOrder+1;
    render();
  } else {
    submitDiagnostico();
  }
}

function goBack(){
  if(state.qIndex>0){ state.qIndex--; render(); }
}

async function submitDiagnostico(){
  state.submitting=true; render();
  try{
    await withTimeout(
      db.collection("diagnosticos_alavanca").add({
        dataHora: firebase.firestore.FieldValue.serverTimestamp(),
        versaoQuestionario: VERSAO_QUESTIONARIO,
        respostas: state.answers
      }),
      15000,
      "Tempo esgotado ao enviar."
    );
    state.screen="thanks";
  }catch(e){
    console.error(e);
    toast("Erro ao enviar (" + (e.code||e.message||"falha de conexão") + "). Verifique a rede e tente novamente.", 5000);
  }
  state.submitting=false;
  render();
}

/* ============ MONITOR: LOGIN POR PIN ============ */
function pinPress(digit){
  if(state.pinInput.length>=4) return;
  state.pinInput += digit;
  render();
  if(state.pinInput.length===4){
    setTimeout(()=> checkPin(), 150);
  }
}
function pinBackspace(){
  state.pinInput = state.pinInput.slice(0,-1);
  render();
}
async function checkPin(){
  const pin = state.pinInput;
  state.pinInput = "";
  render();
  await signInMonitorPin(pin);
}
async function monitorLogout(){
  try{ await auth.signOut(); }catch(e){ console.error(e); }
  state.monitorLoggedIn=false;
  state.monitorUser=null;
  state.responses=[];
  state.responsesLoaded=false;
  state.screen="intro";
  render();
}

/* ============ MONITOR: CARREGAR RESPOSTAS ============ */
async function loadResponses(){
  try{
    const snap = await withTimeout(
      db.collection("diagnosticos_alavanca").orderBy("dataHora","desc").get(),
      15000,
      "Tempo esgotado ao carregar respostas."
    );
    state.responses = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.responsesLoaded = true;
  }catch(e){
    console.error(e);
    toast("Erro ao carregar respostas (" + (e.code||e.message||"falha de conexão") + ").", 5000);
  }
}

/* ============ EXCLUSÃO DE RESPOSTAS ============ */
async function deleteResponse(id){
  if(!confirm("Excluir esta resposta permanentemente? Essa ação não pode ser desfeita.")) return;
  try{
    await withTimeout(db.collection("diagnosticos_alavanca").doc(id).delete(), 12000, "Tempo esgotado ao excluir.");
    state.responses = state.responses.filter(r=>r.id!==id);
    render();
    toast("Resposta excluída.");
  }catch(e){
    console.error(e);
    toast("Erro ao excluir (" + (e.code||e.message||"falha de conexão") + ").", 5000);
  }
}

async function deleteAllFiltered(){
  const list = filteredResponses();
  if(list.length===0) return;
  const ok = confirm(`Excluir permanentemente ${list.length} resposta(s)? Essa ação não pode ser desfeita.`);
  if(!ok) return;
  const ok2 = confirm(`Confirme novamente: apagar ${list.length} resposta(s) do diagnóstico?`);
  if(!ok2) return;
  try{
    // Firestore permite no máximo 500 operações por lote
    const chunks = [];
    for(let i=0;i<list.length;i+=450) chunks.push(list.slice(i,i+450));
    for(const chunk of chunks){
      const batch = db.batch();
      chunk.forEach(r=> batch.delete(db.collection("diagnosticos_alavanca").doc(r.id)) );
      await withTimeout(batch.commit(), 20000, "Tempo esgotado ao excluir em lote.");
    }
    const idsToRemove = new Set(list.map(r=>r.id));
    state.responses = state.responses.filter(r=>!idsToRemove.has(r.id));
    render();
    toast(`${list.length} resposta(s) excluída(s).`);
  }catch(e){
    console.error(e);
    toast("Erro ao excluir em lote (" + (e.code||e.message||"falha de conexão") + ").", 5000);
  }
}

async function saveEditResponse(id){

function filteredResponses(){
  let list = state.responses;
  const now = new Date();
  if(state.filtroPeriodo==="hoje"){
    list = list.filter(r=>{
      const d = r.dataHora && r.dataHora.toDate ? r.dataHora.toDate() : null;
      return d && d.toDateString()===now.toDateString();
    });
  } else if(state.filtroPeriodo==="7dias"){
    const lim = new Date(now.getTime()-7*24*60*60*1000);
    list = list.filter(r=>{
      const d = r.dataHora && r.dataHora.toDate ? r.dataHora.toDate() : null;
      return d && d>=lim;
    });
  } else if(state.filtroPeriodo==="30dias"){
    const lim = new Date(now.getTime()-30*24*60*60*1000);
    list = list.filter(r=>{
      const d = r.dataHora && r.dataHora.toDate ? r.dataHora.toDate() : null;
      return d && d>=lim;
    });
  }
  if(state.searchTerm){
    const term = state.searchTerm.toLowerCase();
    list = list.filter(r=> JSON.stringify(r.respostas).toLowerCase().includes(term));
  }
  return list;
}

function countBy(list, field, isMulti){
  const counts = {};
  list.forEach(r=>{
    const v = r.respostas[field];
    if(v===undefined || v===null) return;
    if(isMulti){
      (Array.isArray(v)?v:[]).forEach(x=> counts[x]=(counts[x]||0)+1 );
    } else {
      counts[v]=(counts[v]||0)+1;
    }
  });
  return counts;
}

function renderBarChart(canvasId, countsObj, color){

    options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}}, y:{beginAtZero:true, ticks:{precision:0}}}}
  });
}

/* ============ TAB ANÁLISE AUTOMÁTICA ============ */
function tabAnalise(){
  const list = filteredResponses();
  const n = list.length;
  if(n<5){
    return `<div class="card">${filtroPeriodoHtml()}</div><div class="card center small">Ainda não existem respostas suficientes para gerar esta análise.</div>`;
  }
  const insights = [];
  const c2 = countBy(list,"q2");
  const topEtapa = Object.entries(c2).sort((a,b)=>b[1]-a[1])[0];
  if(topEtapa) insights.push(`A maior concentração de respostas indica maior atenção necessária na etapa de <b>${topEtapa[0]}</b> (${Math.round(topEtapa[1]/n*100)}% das respostas).`);

  const claro = list.filter(r=>["Parcialmente","Não"].includes(r.respostas.q3)).length;
  if(claro/n >= 0.2) insights.push(`Uma parcela significativa (${Math.round(claro/n*100)}%) considera que o padrão visual da alavanca poderia ser mais claro.`);

  const c9 = countBy(list,"q9",true);
  const topAtencao = Object.entries(c9).sort((a,b)=>b[1]-a[1])[0];
  if(topAtencao) insights.push(`O fator mais citado como capaz de tirar a atenção do processo foi <b>${topAtencao[0]}</b>.`);

  const c4 = countBy(list,"q4",true);
  const topDificuldade = Object.entries(c4).sort((a,b)=>b[1]-a[1])[0];
  if(topDificuldade) insights.push(`A dificuldade mais citada na execução foi <b>${topDificuldade[0]}</b>.`);

  const favErro = list.filter(r=>["Sim","Talvez"].includes(r.respostas.q13)).length;
  if(favErro/n >= 0.2) insights.push(`${Math.round(favErro/n*100)}% dos operadores acreditam que existe alguma característica do processo que favorece a ocorrência de erro.`);

  const c11 = countBy(list,"q11");
  const treinoRuim = (c11["Regular"]||0)+(c11["Precisa melhorar"]||0)+(c11["Não recebi treinamento específico"]||0);
  if(treinoRuim/n >= 0.25) insights.push(`${Math.round(treinoRuim/n*100)}% avaliam o treinamento recebido como regular, insuficiente ou inexistente.`);

  return `
    <div class="card">${filtroPeriodoHtml()}</div>
    <div class="card">
      <h3 style="margin-top:0;">Principais pontos de atenção</h3>
      ${insights.length? insights.map(i=>`<div class="insight">${i}</div>`).join("") : `<p class="small">Nenhum ponto de atenção relevante identificado no período.</p>`}
      <p class="small" style="margin-top:14px;">Análise gerada automaticamente a partir de ${n} respostas reais. Nenhuma informação foi inferida além dos dados coletados.</p>
    </div>
  `;
}

/* ============ TAB VOZ DO OPERADOR ============ */
const TEMA_KEYWORDS = {
  "Informação visual": ["visual","foto","imagem","marcação","vídeo","ver","enxergar"],
  "Treinamento": ["treinamento","treinar","explicar","ensinar","instrução"],
  "Ritmo da operação": ["ritmo","tempo","rápido","correria","pressão","ciclo"],
  "Conferência": ["conferência","conferir","checklist","checar","verificar"],
  "Equipamento": ["ferramenta","equipamento","dispositivo","torque","chave"]
};

function extractThemes(texts){
  const counts = {};
  Object.keys(TEMA_KEYWORDS).forEach(t=>counts[t]=0);
  texts.forEach(txt=>{
    const low = (txt||"").toLowerCase();
    Object.entries(TEMA_KEYWORDS).forEach(([tema,kws])=>{
      if(kws.some(k=>low.includes(k))) counts[tema]++;
    });
  });
  return Object.entries(counts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
}

function tabVoz(){
  const list = filteredResponses();

  const q15 = list.map(r=>r.respostas.q15).filter(t=>t && t.trim());
  const temasQ14 = extractThemes(q14);
  const temasQ15 = extractThemes(q15);
  return `
    <div class="card">${filtroPeriodoHtml()}</div>
    <div class="card">
      <h3 style="margin-top:0;">O que pode estar favorecendo o problema</h3>

    </div>

      ${temasQ15.length? `<div>${temasQ15.map(([t,c])=>`<span class="theme-tag">${t} (${c})</span>`).join("")}</div>`:""}

   A matriz não "define" a causa. Ela organiza evidências citadas pelos
   operadores em categorias para facilitar a análise do processo.
   Fontes usadas: Q3, Q4, Q6, Q7, Q8, Q9, Q10, Q11, Q12, Q13, Q14 e Q15.
*/
const MATRIZ_CATEGORIAS = {
  "MÉTODO": {
    icon:"📘",
    keywords:["padrão","instrução","procedimento","sequência","checklist","informação","visual","imagem","foto","marcação","vídeo","conferência","conferir","verificar","regulagem","posicionamento"],
    exact:{
      q3:["Sim, mas poderia ser mais claro","Parcialmente","Não"],
      q7:["Parcialmente","Não"],
      q4:["Dificuldade para visualizar o padrão","Falta de informação"],
      q8:[],
      q12:[]
    }
  },
  "MÁQUINA": {
    icon:"⚙️",
    keywords:["ferramenta","equipamento","dispositivo","torque","chave","skillit","aperto","máquina"],
    exact:{
      q4:["Ferramenta/equipamento"],
      q8:[],
      q9:["Problemas no equipamento"],
      q12:["Dispositivo à prova de erro"]
    }
  },
  "MEIO AMBIENTE": {
    icon:"🏭",
    keywords:["posto","movimentação","conversa","distração","ritmo","barulho","ruído","espaço","pressão","correria"],
    exact:{
      q4:["Ritmo da linha","Conversas ou movimentação no posto"],
      q9:["Conversas","Movimentação de pessoas","Pressão/ritmo da produção"]
    }
  },
  "PESSOA": {
    icon:"👷",
    keywords:["atenção","distraído","distração","cansaço","esqueci","pressa","dúvida","treinamento","treinar","explicar","ensinar","ajuda"],
    exact:{
      q9:["Conversas","Dúvidas sobre o processo","Cansaço"],
      q10:["Às vezes","Raramente","Não"],
      q11:["Regular","Precisa melhorar","Não recebi treinamento específico"],
      q12:[]
    }
  },
  "PROCESSO": {
    icon:"🔄",
    keywords:["tempo","ritmo","modelo","mudança","repetição","complexidade","ergonomia","ciclo","fixação","regulagem","aperto"],
    exact:{
      q4:["Mudança de modelo","Ritmo da linha"],
      q5:[],
      q6:["Na maioria das vezes","Às vezes","Não"],
      q13:["Sim","Talvez"]
    }
  }
};

function matrizArray(v){
  if(Array.isArray(v)) return v.filter(x=>x!==null && x!==undefined && String(x).trim());
  if(v===null || v===undefined || String(v).trim()==="") return [];
  return [String(v)];
}

function textoMatriz(v){
  return matrizArray(v).join("; ");
}

function addMatrizEvidence(bucket, category, text, source, kind="evidencia"){
  const clean=String(text||"").trim();
  if(!clean) return;
  bucket[category].push({text:clean, source, kind});
}

function categoriaPorTextoLivre(text){
  const low=(text||"").toLowerCase();
  const found=[];
  Object.entries(MATRIZ_CATEGORIAS).forEach(([cat, cfg])=>{
    if(cfg.keywords.some(k=>low.includes(k))) found.push(cat);
  });
  return found;
}

function montarMatriz(list){
  const buckets={};
  Object.keys(MATRIZ_CATEGORIAS).forEach(cat=>buckets[cat]=[]);

  list.forEach(r=>{
    const a=r.respostas||{};

    /* Respostas estruturadas: mapeamento explícito das opções do questionário. */
    Object.entries(MATRIZ_CATEGORIAS).forEach(([cat,cfg])=>{
      Object.entries(cfg.exact||{}).forEach(([qid, options])=>{
        const values=matrizArray(a[qid]);
        values.forEach(value=>{
          if(options.includes(value)) addMatrizEvidence(buckets,cat,value,`Q${qid.replace("q","")}`);
        });
      });
    });

    /* Respostas abertas: Q14 e Q15 entram somente quando há indícios textuais.
       Um mesmo texto pode aparecer em mais de uma categoria quando contém
       sinais de categorias diferentes; isso é intencional e deve ser tratado
       como pista para análise, não como causa definitiva. */
    ["q14","q15"].forEach(qid=>{
      matrizArray(a[qid]).forEach(value=>{
        const cats=categoriaPorTextoLivre(value);
        cats.forEach(cat=>addMatrizEvidence(buckets,cat,value,`Q${qid.replace("q","")}`,"aberta"));
      });
    });
  });

  return buckets;
}

function agruparMatrizItens(items){
  const groups={};
  items.forEach(item=>{
    const key=item.text.toLowerCase();
    if(!groups[key]) groups[key]={text:item.text,count:0,sources:new Set(),kind:new Set()};
    groups[key].count++;
    groups[key].sources.add(item.source);
    groups[key].kind.add(item.kind);
  });
  return Object.values(groups).sort((a,b)=>b.count-a.count || a.text.localeCompare(b.text,"pt-BR"));
}

function matrizCategoriaHtml(cat,items){
  const grupos=agruparMatrizItens(items);
  const total=items.length;
  return `
    <div class="matrix-cat" style="margin-top:18px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <h4 style="margin:0;">${MATRIZ_CATEGORIAS[cat].icon} ${cat}</h4>
        <span class="theme-tag">${total} evidência(s)</span>
      </div>
      ${grupos.length ? `
        <div class="small" style="margin:7px 0 8px;">Principais sinais citados:</div>
        ${grupos.slice(0,6).map((g,i)=>`
          <div class="response-item" style="margin-top:6px;">

          </div>
        `).join("")}
        ${grupos.length>6?`<div class="small" style="margin-top:8px;">+ ${grupos.length-6} outro(s) sinal(is) nesta categoria.</div>`:""}

  `;
}

      <div class="modal-section">
        <h4>ARMAZENAMENTO</h4>
        <div class="storage-bar-bg"><div class="storage-bar-fill" style="width:${pct}%"></div></div>

        ${last? "" : `<div class="insight">Você ainda não fez nenhum backup local. As respostas já ficam salvas no Firestore, mas um backup em .json é sua cópia extra de segurança.</div>`}
      </div>

      <div class="modal-section">
        <h4>EXPORTAR</h4>
        <div class="modal-btn-row">
          <button class="btn btn-dark" id="btnExportJson">↓ Arquivo .json</button>
          <button class="btn btn-purple" id="btnSaveDevice">📦 Salvar no dispositivo</button>
        </div>
      </div>

      <div class="modal-section">
        <h4>RESTAURAR</h4>
        <p class="small">Restaura o questionário (perguntas, tipos, ordem, ativação) a partir de um arquivo .json de backup. As respostas do arquivo ficam disponíveis só para conferência — elas não são reenviadas ao Firestore, para não gerar duplicidade.</p>
        <div class="modal-btn-row">
          <label class="btn btn-outline" style="cursor:pointer;">📁 De arquivo .json
            <input type="file" id="inputRestore" accept="application/json" style="display:none;">
          </label>
        </div>
      </div>
    </div>
  </div>`;
}

function buildBackupPayload(){
  return {
    app: "ALAVANCA ZERO",
    versaoQuestionario: VERSAO_QUESTIONARIO,
    exportadoEm: new Date().toISOString(),
    perguntas: state.questions,
    respostas: state.responses.map(r=>({
      dataHora: r.dataHora && r.dataHora.toDate ? r.dataHora.toDate().toISOString() : null,
      versaoQuestionario: r.versaoQuestionario,
      respostas: r.respostas
    }))
  };
}

function markBackupDone(){
  localStorage.setItem(BACKUP_KEY, new Date().toISOString());
}

async function exportBackupDownload(){
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `alavanca-zero-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  markBackupDone();
  toast("Backup exportado.");
  render();
}

async function saveBackupToDevice(){
  const payload = buildBackupPayload();
  const stamp = new Date().toISOString().slice(0,10);
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: `alavanca-zero-backup-${stamp}.json`,
        types: [{description:"JSON", accept:{"application/json":[".json"]}}]
      });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(payload,null,2));
      await writable.close();
      markBackupDone();
      toast("Backup salvo no dispositivo.");
      render();
      return;
    }catch(e){
      if(e.name==="AbortError") return;
      console.error(e);
    }
  }
  // Fallback (iOS Safari / navegadores sem File System Access API)
  exportBackupDownload();
}

async function restoreFromFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.perguntas || !Array.isArray(data.perguntas)){
      toast("Arquivo inválido: nenhuma lista de perguntas encontrada.");
      return;
    }
    if(!confirm(`Restaurar ${data.perguntas.length} pergunta(s) deste backup? O questionário atual será substituído.`)) return;
    state.questions = data.perguntas;
    await saveQuestions();
    toast("Perguntas restauradas com sucesso.");
    render();
  }catch(e){
    console.error(e);
    toast("Erro ao ler o arquivo de backup.");
  }
}

/* ============ HELPERS ============ */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,"&#96;"); }
function formatDate(ts){
  if(!ts || !ts.toDate) return "—";
  const d = ts.toDate();
  return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}

/* ============ EVENTOS (delegação, sem inline onclick — compatibilidade iOS) ============ */
function attachMonitorLoginEvents(){
  const root = app();

  root.querySelectorAll("[data-pin-key]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const key = btn.getAttribute("data-pin-key");

      if(key === "⌫"){
        state.pinInput = state.pinInput.slice(0,-1);
        render();
        return;
      }

      if(key === "C"){
        state.pinInput = "";
        render();
        return;
      }

      if(!/^\d$/.test(key) || state.pinInput.length >= 4) return;

      state.pinInput += key;
      render();

      if(state.pinInput.length === 4){
        setTimeout(()=>signInMonitorPin(state.pinInput), 120);
      }
    });
  });

  const back = root.querySelector("#btnVoltarIntro");
  if(back) back.addEventListener("click", e=>{
    e.preventDefault();
    state.pinInput="";
    state.screen="intro";
    render();
  });
}

function attachEvents(){
  if(state.screen==="monitorLogin") attachMonitorLoginEvents();
  const root = app();

  const on = (sel, evt, fn) => { const el = root.querySelector(sel); if(el) el.addEventListener(evt, fn); };
  const onAll = (sel, evt, fn) => { root.querySelectorAll(sel).forEach(el=>el.addEventListener(evt, fn)); };

  on("#btnIniciar","click", startQuiz);
  on("#btnMonitorArea","click", ()=>{ state.screen="monitorLogin"; render(); });
  on("#btnVoltarIntro","click", (e)=>{ e.preventDefault(); state.screen="intro"; render(); });
  on("#btnFinalizar","click", ()=>{ state.screen="intro"; render(); });
  on("#btnAlterarPin","click", ()=>{ state.showPinModal=true; render(); });
  on("#btnCancelarPin","click", ()=>{ state.showPinModal=false; render(); });
  on("#pinOverlay","click", (e)=>{ if(e.target.id==="pinOverlay"){ state.showPinModal=false; render(); } });
  on("#btnSalvarPin","click", async ()=>{
    const atual = root.querySelector("#pinAtual")?.value.trim();
    const novo = root.querySelector("#pinNovo")?.value.trim();
    const novo2 = root.querySelector("#pinNovo2")?.value.trim();

    if(!validarPin(atual) || !validarPin(novo) || !validarPin(novo2)){
      toast("Preencha os três campos com 4 números.");
      return;
    }
    if(novo !== novo2){
      toast("A confirmação do novo PIN não confere.");
      return;
    }

    const btn = root.querySelector("#btnSalvarPin");
    btn.disabled=true;
    btn.textContent="ALTERANDO...";
    await alterarPinMonitor(atual, novo);
  });

  on("#btnBackup","click", ()=>{ state.showBackupModal=true; render(); });
  on("#btnCloseBackup","click", ()=>{ state.showBackupModal=false; render(); });
  on("#backupOverlay","click", (e)=>{ if(e.target.id==="backupOverlay"){ state.showBackupModal=false; render(); } });
  on("#btnExportJson","click", exportBackupDownload);
  on("#btnSaveDevice","click", saveBackupToDevice);
  on("#inputRestore","change", (e)=>{
    const file = e.currentTarget.files[0];
    if(file) restoreFromFile(file);
  });
  on("#btnSair","click", monitorLogout);

  // Quiz answers
  onAll("[data-single]","click",(e)=>{
    const qid = e.currentTarget.getAttribute("data-single");
    const val = e.currentTarget.getAttribute("data-val");
    state.answers[qid] = isFinite(val) && currentQuestion().type==="scale" ? Number(val) : val;
    render();
  });
  onAll("[data-multi]","click",(e)=>{
    const qid = e.currentTarget.getAttribute("data-multi");
    const val = e.currentTarget.getAttribute("data-val");
    const arr = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
    const i = arr.indexOf(val);
    if(i>=0) arr.splice(i,1); else arr.push(val);
    state.answers[qid] = arr;
    render();
  });
  onAll("[data-open]","input",(e)=>{
    const qid = e.currentTarget.getAttribute("data-open");
    state.answers[qid] = e.currentTarget.value;
  });
  on("#btnVoltar","click", goBack);
  on("#btnProxima","click", goNext);

  // Monitor tabs
  onAll("[data-tab]","click",(e)=>{
    state.monitorTab = e.currentTarget.getAttribute("data-tab");
    state.editingQuestion=null;
    state.editingResponse=null;
    render();
  });
  onAll("[data-periodo]","click",(e)=>{
    state.filtroPeriodo = e.currentTarget.getAttribute("data-periodo");
    render();
  });
  on("#searchInput","input",(e)=>{ state.searchTerm = e.currentTarget.value; render(); });
  onAll("[data-del-resp]","click", (e)=>{ deleteResponse(e.currentTarget.getAttribute("data-del-resp")); });
  on("#btnDelAllFiltered","click", deleteAllFiltered);
  onAll("[data-edit-resp]","click", (e)=>{ startEditResponse(e.currentTarget.getAttribute("data-edit-resp")); });
  on("#btnCancelEditResp","click", cancelEditResponse);
  on("#btnSaveEditResp","click", (e)=>{ saveEditResponse(e.currentTarget.getAttribute("data-save-resp-id")); });
  onAll("[data-edit-single]","click",(e)=>{
    const qid = e.currentTarget.getAttribute("data-edit-single");
    state.editingResponseAnswers[qid] = e.currentTarget.getAttribute("data-val");
    render();
  });
  onAll("[data-edit-multi]","click",(e)=>{
    const qid = e.currentTarget.getAttribute("data-edit-multi");
    const val = e.currentTarget.getAttribute("data-val");
    const arr = Array.isArray(state.editingResponseAnswers[qid]) ? state.editingResponseAnswers[qid].slice() : [];
    const i = arr.indexOf(val);
    if(i>=0) arr.splice(i,1); else arr.push(val);
    state.editingResponseAnswers[qid] = arr;
    render();
  });
  onAll("[data-edit-open]","input",(e)=>{
    const qid = e.currentTarget.getAttribute("data-edit-open");
    state.editingResponseAnswers[qid] = e.currentTarget.value;
  });

  // Admin CRUD
  on("#btnNovaPergunta","click", ()=>{ state.editingQuestion="__new__"; render(); });
  onAll("[data-edit-q]","click",(e)=>{ state.editingQuestion = e.currentTarget.getAttribute("data-edit-q"); render(); });
  onAll("[data-toggle-q]","click",async (e)=>{
    const id = e.currentTarget.getAttribute("data-toggle-q");
    const q = state.questions.find(x=>x.id===id);
    const prev = q.active;
    q.active = !q.active;
    render();
    try{ await saveQuestions(); }
    catch(err){ console.error(err); q.active = prev; render(); toast("Erro ao salvar (" + (err.code||err.message||"falha de conexão") + ").", 5000); }
  });
  onAll("[data-up-q]","click", async (e)=>{
    const id = e.currentTarget.getAttribute("data-up-q");
    const before = JSON.parse(JSON.stringify(state.questions));
    moveQuestion(id,-1); render();
    try{ await saveQuestions(); }
    catch(err){ console.error(err); state.questions = before; render(); toast("Erro ao salvar (" + (err.code||err.message||"falha de conexão") + ").", 5000); }
  });
  onAll("[data-down-q]","click", async (e)=>{
    const id = e.currentTarget.getAttribute("data-down-q");
    const before = JSON.parse(JSON.stringify(state.questions));
    moveQuestion(id,1); render();
    try{ await saveQuestions(); }
    catch(err){ console.error(err); state.questions = before; render(); toast("Erro ao salvar (" + (err.code||err.message||"falha de conexão") + ").", 5000); }
  });
  onAll("[data-del-q]","click", async (e)=>{
    const id = e.currentTarget.getAttribute("data-del-q");
    if(!confirm("Excluir esta pergunta permanentemente?")) return;
    const before = JSON.parse(JSON.stringify(state.questions));
    state.questions = state.questions.filter(x=>x.id!==id);
    render();
    try{ await saveQuestions(); }
    catch(err){ console.error(err); state.questions = before; render(); toast("Erro ao excluir (" + (err.code||err.message||"falha de conexão") + ").", 5000); }
  });

  on("#editQType","change",(e)=>{
    const wrap = root.querySelector("#optionsWrap");
    const newType = e.currentTarget.value;
    if(newType==="single"||newType==="multi"){
      const existing = Array.from(root.querySelectorAll(".opt-edit-input")).map(i=>i.value);
      wrap.innerHTML = optionsEditorHtml(existing.length? existing : ["",""]);
    } else { wrap.innerHTML=""; }
  });
  on("#btnAddOpt","click",()=>{
    const list = root.querySelector("#optsList");
    const idx = list.querySelectorAll(".opt-edit-input").length;
    const div = document.createElement("div");
    div.style.cssText="display:flex; gap:6px; margin-top:6px;";
    div.innerHTML = `<input type="text" class="opt-edit-input" data-opt-idx="${idx}" value=""><button class="icon-btn" data-del-opt="${idx}">🗑</button>`;
    list.appendChild(div);
    div.querySelector("[data-del-opt]").addEventListener("click", ()=>div.remove());
  });
  onAll("[data-del-opt]","click",(e)=>{ e.currentTarget.parentElement.remove(); });

  on("#btnCancelEdit","click", ()=>{ state.editingQuestion=null; render(); });
  on("#btnCloseQEdit","click", ()=>{ state.editingQuestion=null; render(); });
  on("#questionEditorOverlay","click", (e)=>{ if(e.target.id==="questionEditorOverlay"){ state.editingQuestion=null; render(); } });
  on("#btnSaveEdit","click", async ()=>{
    const text = root.querySelector("#editQText").value.trim();
    const type = root.querySelector("#editQType").value;
    const required = root.querySelector("#editQRequired").checked;
    if(!text){ toast("Preencha o texto da pergunta."); return; }
    let options = [];
    if(type==="single"||type==="multi"){
      options = Array.from(root.querySelectorAll(".opt-edit-input")).map(i=>i.value.trim()).filter(Boolean);
      if(options.length<2){ toast("Adicione pelo menos 2 alternativas."); return; }
    }
    const before = JSON.parse(JSON.stringify(state.questions));
    if(state.editingQuestion==="__new__"){
      const newId = "q_"+Date.now();
      const maxOrder = Math.max(0,...state.questions.map(x=>x.order));
      state.questions.push({id:newId, order:maxOrder+1, active:true, required, type, text, options: options.length?options:undefined});
    } else {
      const q = state.questions.find(x=>x.id===state.editingQuestion);
      q.text=text; q.type=type; q.required=required;
      if(options.length) q.options=options; else delete q.options;
    }
    const btn = root.querySelector("#btnSaveEdit");
    btn.disabled = true; btn.textContent = "Salvando...";
    try{
      await saveQuestions();
      state.editingQuestion=null;
      render();
      toast("Pergunta salva.");
    }catch(err){
      console.error(err);
      state.questions = before;
      btn.disabled = false; btn.textContent = "Salvar";
      toast("Erro ao salvar (" + (err.code||err.message||"falha de conexão") + ").", 5000);
    }
  });
}

function moveQuestion(id, dir){
  const sorted = state.questions.slice().sort((a,b)=>a.order-b.order);
  const idx = sorted.findIndex(x=>x.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=sorted.length) return;
  const tmp = sorted[idx].order;
  sorted[idx].order = sorted[swapIdx].order;
  sorted[swapIdx].order = tmp;
}

/* ============ INIT ============ */
async function init(){
  auth.onAuthStateChanged(async (user)=>{
    if(user){
      try{
        const profile = await db.collection("users").doc(user.uid).get();
        if(profile.exists && profile.data().role === "monitor"){
          state.monitorLoggedIn = true;
          state.monitorUser = user;
          state.screen = "monitor";
          state.monitorTab = "dashboard";
          await loadResponses();
        } else {
          await auth.signOut();
        }
      }catch(e){ console.error(e); }
    }
    await loadQuestions();
    render();
  });
}
init();
</script>
</body>
</html>
